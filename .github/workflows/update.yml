name: Update news and deploy
on:
  schedule:
    # Even UTC hours also map to even Beijing hours: 00:00, 02:00, …, 22:00.
    - cron: '0 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: headline-update-and-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test translation gateway
        run: |
          npm ci --prefix cloudflare --ignore-scripts
          npm test --prefix cloudflare
      - name: Test data pipeline
        run: |
          python -m pytest -q
          node --test tests/*.test.cjs
      - name: Fetch English news only
        run: python -m scripts.collect
      - name: Record two-day observation
        run: python -m scripts.report
      - name: Save English news history
        run: bash scripts/save_snapshots.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
